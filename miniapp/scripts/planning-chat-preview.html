<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>留学规划 · 聊天演示</title><style>
:root{color-scheme:light;--ink:#252724;--muted:#646961;--line:#e8eae6;--green:#286858;--bubble:#f1f2f0}*{box-sizing:border-box}body{margin:0;background:white;color:var(--ink);font:16px/1.8 -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}button,textarea,summary{font:inherit}button,summary{cursor:pointer}button{border:0;background:transparent;color:inherit;padding:10px 14px;min-height:44px}button:hover,summary:hover{background:var(--bubble)}button:disabled{opacity:.45;cursor:default}button:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--green);outline-offset:3px}::selection{background:#dff4ea}[hidden]{display:none!important}
.app{height:100dvh;max-width:820px;margin:auto;display:flex;flex-direction:column}header{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;gap:16px}header strong{font-size:18px;font-weight:600}.muted{color:var(--muted);font-size:14px}details{position:relative}summary{list-style:none;padding:8px 12px;min-height:44px}summary::-webkit-details-marker{display:none}.menu{position:absolute;right:0;top:46px;width:220px;border:1px solid var(--line);border-radius:12px;background:white;z-index:5;padding:8px}.menu button{display:block;text-align:left;width:100%;font-size:14px}.disclaimer{text-align:center;color:var(--muted);font-size:13px;padding:0 20px 8px}.conversation{flex:1;overflow:auto;min-height:0;padding:12px 28px 28px;scrollbar-width:thin;scrollbar-color:#c8cec8 transparent}.welcome{padding-top:clamp(40px,12vh,120px)}h1{font-size:clamp(27px,4vw,36px);font-weight:600;line-height:1.5;letter-spacing:-.025em;margin:0 0 12px}.welcome p{color:var(--muted);margin:0 0 24px}.suggestions{display:flex;flex-direction:column;align-items:flex-start;gap:2px}.suggestions button{padding-left:0;text-align:left;color:var(--green)}
.message{white-space:pre-wrap;overflow-wrap:anywhere;margin:24px 0;line-height:1.9}.user{background:var(--bubble);border-radius:16px;padding:10px 16px;margin-left:auto;width:fit-content;max-width:88%}.assistant{padding:0 2px}.error{font-size:14px;color:#8b3e27}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{font-size:14px;color:var(--muted);padding-left:0;padding-right:16px}footer{padding:8px 28px max(16px,env(safe-area-inset-bottom));background:white}form{display:flex;align-items:flex-end;border:1px solid #cbd0c9;border-radius:18px;padding:10px;gap:8px}textarea{resize:none;border:0;background:transparent;flex:1;min-width:0;line-height:1.6;padding:6px 8px;height:64px;color:var(--ink);font-size:16px;caret-color:var(--green)}textarea::placeholder{color:var(--muted)}#send{width:44px;height:44px;flex-shrink:0;background:var(--ink);color:white;border-radius:50%;padding:11px;display:grid;place-items:center}svg{width:22px;height:22px}footer p{text-align:center;font-size:12px;color:var(--muted);margin:8px 0 0}dialog{border:1px solid var(--line);border-radius:16px;padding:24px;color:var(--ink);width:min(540px,calc(100% - 32px));max-height:80dvh;overflow:auto}dialog::backdrop{background:rgba(25,30,26,.25)}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:16px}.panel-head h2{font-size:20px;margin:0}#panel-body{white-space:pre-wrap;overflow-wrap:anywhere}#panel-body>button{display:block;color:var(--green);text-align:left}#panel-body p{margin:16px 0}@media(max-width:520px){header{padding:12px 18px}.conversation{padding:8px 20px 20px}footer{padding-left:16px;padding-right:16px}.welcome{padding-top:9vh}.disclaimer{font-size:12px}.user{max-width:92%}}
</style></head><body><main class="app"><header><strong>留学规划</strong><details id="menu"><summary aria-label="更多操作">更多</summary><nav class="menu"><button id="history">本页历史</button><button id="reset">重置演示（清空本页）</button><button id="failure">模拟下次回复失败</button></nav></details></header><div class="disclaimer">交互演示 · 预设回复，非真实 AI · 不联网</div><section class="conversation" id="conversation" aria-label="留学规划对话"><div id="welcome" class="welcome"><h1>想去马来西亚，<br>从哪聊起？</h1><p>说说你的想法，不用先填资料。</p><div class="suggestions"><button data-prompt="我想去马来西亚读硕士，预算十万够吗？">读硕士，预算十万够吗？</button><button data-prompt="还没想好专业，先给我一个规划方向">还没想好专业，先聊聊方向</button><button data-prompt="还没有雅思成绩，可以先了解吗？">还没有雅思，可以先了解吗？</button></div></div><div id="messages" role="log" aria-live="polite" aria-relevant="additions text"></div><div id="error" class="error" role="alert" hidden><span id="error-copy"></span><button id="retry">重试回复</button></div><div class="actions"><button id="save" hidden>保存对话</button><button id="handoff" hidden>模拟转顾问</button></div></section><footer><form id="chat-form"><textarea id="composer" aria-label="聊天消息" placeholder="想问什么，直接说…" maxlength="2000" rows="2"></textarea><button id="send" aria-label="发送" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button></form><p>仅本页临时保存 · 请勿输入真实隐私资料 · 刷新即清空</p></footer></main><dialog id="panel" aria-labelledby="panel-title"><div class="panel-head"><h2 id="panel-title"></h2><button id="close">关闭</button></div><div id="panel-body"></div></dialog><script src="planning-chat.js"></script></body></html>
