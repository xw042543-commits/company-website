name: Deploy production

on:
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://yangdoujiao.com

    steps:
      - name: Select and validate release SHA
        id: release
        shell: bash
        env:
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          release_sha="$DISPATCH_SHA"
          [[ $release_sha =~ ^[0-9a-f]{40}$ ]] || { echo "A full release SHA is required" >&2; exit 64; }
          printf 'sha=%s\n' "$release_sha" >> "$GITHUB_OUTPUT"

      - name: Require successful CI for exact release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          ci_conclusion="$(
            gh api \
              "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=100" \
            | jq -r --arg sha "$RELEASE_SHA" \
                '.workflow_runs | map(select(.head_sha == $sha)) | sort_by(.created_at) | reverse | .[0].conclusion // ""'
          )"
          [[ $ci_conclusion == success ]] || {
            echo "The exact release SHA does not have a successful main push CI run" >&2
            exit 69
          }

      - name: Check out exact release
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.sha }}

      - name: Deploy release through verified SSH
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          APP_MINIAPP_WECHAT_APP_ID: ${{ secrets.APP_MINIAPP_WECHAT_APP_ID }}
          APP_MINIAPP_WECHAT_APP_SECRET: ${{ secrets.APP_MINIAPP_WECHAT_APP_SECRET }}
        run: |
          umask 077
          deploy_key="$RUNNER_TEMP/production_deploy_key"
          known_hosts="$RUNNER_TEMP/production_known_hosts"
          deploy_script="$RUNNER_TEMP/production_deploy_script"
          trap 'rm -f "$deploy_key" "$known_hosts" "$deploy_script"' EXIT
          printf '%s\n' "$PRODUCTION_SSH_PRIVATE_KEY" > "$deploy_key"
          printf '%s\n' "$PRODUCTION_SSH_KNOWN_HOSTS" > "$known_hosts"
          {
            printf 'export APP_MINIAPP_WECHAT_APP_ID=%q\n' "$APP_MINIAPP_WECHAT_APP_ID"
            printf 'export APP_MINIAPP_WECHAT_APP_SECRET=%q\n' "$APP_MINIAPP_WECHAT_APP_SECRET"
            cat scripts/deploy-production.sh
          } > "$deploy_script"
          chmod 600 "$deploy_key" "$known_hosts" "$deploy_script"
          release_sha="$RELEASE_SHA"
          ssh -i "$deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" \
            -p "$PRODUCTION_SSH_PORT" \
            "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST" \
            "bash -s -- '$release_sha'" \
            < "$deploy_script"
