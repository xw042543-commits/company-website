name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend - Java 21 tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPRING_PROFILES_ACTIVE: dev
      POSTGRES_DB: company_website
      POSTGRES_USER: company_app
      POSTGRES_PASSWORD: ci_postgres_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ci_redis_password
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_URL: http://localhost:9200
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      APP_AUTH_PRODUCTION_NOTIFICATION_PROVIDER: NONE
      APP_AUTH_APPROVED_DOMAIN: NONE
      APP_AUTH_PRODUCTION_LAUNCH_APPROVED: "false"
      APP_SESSION_COOKIE_SECURE: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Start PostgreSQL, Redis, and Elasticsearch
        run: docker compose up -d --wait --wait-timeout 180

      - name: Run backend tests
        working-directory: backend
        run: ./mvnw --batch-mode test

      - name: Show service status after a failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200

      - name: Stop test services
        if: always()
        run: docker compose down --volumes

  frontend:
    name: Frontend - lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_BASE_URL: http://backend:8080

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Reject tracked secret files
        shell: bash
        run: |
          tracked_files="$(git ls-files | grep -E '(^|/)\.env($|\.local$)' || true)"
          if [[ -n "$tracked_files" ]]; then
            echo "Environment secret files must not be committed:"
            echo "$tracked_files"
            exit 1
          fi

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deployment:
    name: Deployment - contracts and images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Create isolated CI deployment environment
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/deployment.env" <<'EOF'
          PUBLIC_SITE_URL=https://preview.example.test
          PUBLIC_INDEXING_ENABLED=false
          API_BASE_URL=http://backend:8080
          SPRING_PROFILES_ACTIVE=prod
          CORS_ALLOWED_ORIGINS=https://preview.example.test
          POSTGRES_DB=company_website
          POSTGRES_USER=company_app
          POSTGRES_PASSWORD=ci-only-postgres-secret
          POSTGRES_HOST=postgres
          POSTGRES_PORT=5432
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_PASSWORD=ci-only-redis-secret
          ELASTICSEARCH_URL=http://elasticsearch:9200
          ELASTICSEARCH_PORT=9200
          APP_CONSULTATION_SUBMISSION_ENABLED=false
          FRONTEND_BIND_ADDRESS=127.0.0.1
          FRONTEND_PORT=3000
          EOF

      - name: Validate deployment contracts
        run: |
          node --test scripts/deployment-preflight.test.mjs scripts/deployment-artifacts.test.mjs scripts/deployment-compose.test.mjs scripts/deployment-ci.test.mjs scripts/deployment-documentation.test.mjs
          node scripts/deployment-preflight.mjs "$RUNNER_TEMP/deployment.env"

      - name: Validate production Compose configuration
        run: docker compose --env-file "$RUNNER_TEMP/deployment.env" -f compose.production.yaml config --quiet

      - name: Build frontend production image
        run: docker build --tag udajo/frontend:ci frontend

      - name: Build backend production image
        run: docker build --tag udajo/backend:ci backend
