name: Audit production community image review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://yangdoujiao.com

    steps:
      - name: Check out audited release
        uses: actions/checkout@v7

      - name: Read aggregate review states and bounded review diagnostics
        shell: bash
        env:
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          audit_key="$RUNNER_TEMP/production_audit_key"
          known_hosts="$RUNNER_TEMP/production_known_hosts"
          trap 'rm -f "$audit_key" "$known_hosts"' EXIT
          printf '%s\n' "$PRODUCTION_SSH_PRIVATE_KEY" > "$audit_key"
          printf '%s\n' "$PRODUCTION_SSH_KNOWN_HOSTS" > "$known_hosts"
          remote='cd /opt/company-website && docker compose --env-file .env.production -f compose.production.yaml exec -T postgres sh -c '\''psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"'\'''
          ssh -i "$audit_key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" \
            -p "$PRODUCTION_SSH_PORT" "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST" "$remote" \
            < backend/scripts/audit-community-image-review.sql
          ssh -i "$audit_key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" \
            -p "$PRODUCTION_SSH_PORT" "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST" \
            "cd /opt/company-website && docker compose --env-file .env.production -f compose.production.yaml exec -T backend sh -c 'printf \"image_review_enabled=%s worker_enabled=%s diagnostics_enabled=%s\\n\" \"\$APP_COMMUNITY_IMAGES_REVIEW_ENABLED\" \"\${APP_COMMUNITY_IMAGES_REVIEW_WORKER_ENABLED:-true}\" \"\${APP_COMMUNITY_IMAGES_REVIEW_DIAGNOSTICS_ENABLED:-false}\"'"
          echo 'Recent local media probe results (last two hours; aggregate only)'
          ssh -i "$audit_key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" \
            -p "$PRODUCTION_SSH_PORT" "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST" \
            "cd /opt/company-website && docker compose --env-file .env.production -f compose.production.yaml logs --since 2h backend 2>&1 | grep 'community image review probe mediaHash=' | sed -E 's/.*urlValid=([^ ]+) httpStatus=([^ ]+) jpegType=([^ ]+) jpegPrefix=([^ ]+) declaredLength=([^ ]+).*/urlValid=\\1 httpStatus=\\2 jpegType=\\3 jpegPrefix=\\4 declaredLength=\\5/' | grep '^urlValid=' | sort | uniq -c || true"
          echo 'Recent sanitized callback outcomes (last two hours; aggregate only)'
          ssh -i "$audit_key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" \
            -p "$PRODUCTION_SSH_PORT" "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST" \
            "cd /opt/company-website && docker compose --env-file .env.production -f compose.production.yaml logs --since 2h backend 2>&1 | grep 'community image review callback providerCode=' | sed -E 's/.*providerCode=([^ ]+) suggestion=([^ ]+) reason=([^ ]+) verdict=([^ ]+).*/providerCode=\\1 suggestion=\\2 reason=\\3 verdict=\\4/' | sort | uniq -c"
          echo 'Sanitized review-media HTTP status counts (last two hours)'
          ssh -i "$audit_key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" \
            -p "$PRODUCTION_SSH_PORT" "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST" \
            "cd /opt/company-website && docker compose --env-file .env.production -f compose.production.yaml logs --since 2h caddy 2>&1 | grep 'image-review/media/REDACTED' | grep -Eo 'status[^0-9]*[0-9]{3}' | sort | uniq -c"
          echo 'Sanitized review-media method and transfer-size counts (last two hours)'
          ssh -i "$audit_key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" \
            -p "$PRODUCTION_SSH_PORT" "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST" \
            "cd /opt/company-website && docker compose --env-file .env.production -f compose.production.yaml logs --since 2h caddy 2>&1 | grep 'image-review/media/REDACTED' | grep -Eo 'method[^A-Z]*(GET|HEAD)|size[^0-9]*[0-9]+' | sort | uniq -c"
