name: company-website-preview

services:
  caddy:
    image: caddy:2.11.4-alpine
    environment:
      CADDY_SITE_ADDRESSES: ${CADDY_SITE_ADDRESSES}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - frontend-backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8.2.9
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.5
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9200/_cluster/health?wait_for_status=yellow >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:-udajo/backend:preview}
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      APP_CONSULTATION_SUBMISSION_ENABLED: ${APP_CONSULTATION_SUBMISSION_ENABLED:-false}
      APP_CONSULTATION_PRIVACY_NOTICE_VERSION: ${APP_CONSULTATION_PRIVACY_NOTICE_VERSION:-}
      APP_CONSULTATION_MAXIMUM_BODY_SIZE: ${APP_CONSULTATION_MAXIMUM_BODY_SIZE:-16KB}
      APP_CONSULTATION_RATE_LIMIT_MAXIMUM_SUBMISSIONS: ${APP_CONSULTATION_RATE_LIMIT_MAXIMUM_SUBMISSIONS:-5}
      APP_CONSULTATION_RATE_LIMIT_WINDOW: ${APP_CONSULTATION_RATE_LIMIT_WINDOW:-10m}
      APP_TRUSTED_PROXIES: "127.0.0.1,${FRONTEND_INTERNAL_IP}"
      APP_AUTH_REGISTRATION_ENABLED: ${APP_AUTH_REGISTRATION_ENABLED:-false}
      APP_AUTH_PHONE_REGISTRATION_ENABLED: "false"
      APP_AUTH_AGREEMENT_VERSION: ${APP_AUTH_AGREEMENT_VERSION:-}
      APP_AUTH_PRIVACY_VERSION: ${APP_AUTH_PRIVACY_VERSION:-}
      APP_AUTH_EMAIL_VERIFICATION_TTL: ${APP_AUTH_EMAIL_VERIFICATION_TTL:-5m}
      APP_AUTH_RESEND_COOLDOWN: ${APP_AUTH_RESEND_COOLDOWN:-60s}
      APP_SESSION_COOKIE_SECURE: ${APP_SESSION_COOKIE_SECURE:-true}
      APP_AUTH_PRODUCTION_NOTIFICATION_PROVIDER: ${APP_AUTH_PRODUCTION_NOTIFICATION_PROVIDER:-NONE}
      APP_AUTH_APPROVED_DOMAIN: ${APP_AUTH_APPROVED_DOMAIN:-YANGDOUJIAO_COM}
      APP_AUTH_PUBLIC_SITE_ORIGIN: ${APP_AUTH_PUBLIC_SITE_ORIGIN}
      APP_AUTH_PRODUCTION_LAUNCH_APPROVED: ${APP_AUTH_PRODUCTION_LAUNCH_APPROVED:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      RESEND_ENDPOINT: ${RESEND_ENDPOINT:-https://api.resend.com/emails}
      RESEND_REQUEST_TIMEOUT: ${RESEND_REQUEST_TIMEOUT:-10s}
      APP_AUTH_WECHAT_ENABLED: ${APP_AUTH_WECHAT_ENABLED:-false}
      APP_AUTH_WECHAT_APP_ID: ${APP_AUTH_WECHAT_APP_ID:-}
      APP_AUTH_WECHAT_APP_SECRET: ${APP_AUTH_WECHAT_APP_SECRET:-}
      APP_AUTH_WECHAT_CALLBACK_URL: ${APP_AUTH_WECHAT_CALLBACK_URL:-}
      APP_AUTH_WECHAT_STATE_TTL: ${APP_AUTH_WECHAT_STATE_TTL:-5m}
      APP_AUTH_WECHAT_BINDING_TTL: ${APP_AUTH_WECHAT_BINDING_TTL:-15m}
      APP_MINIAPP_AUTH_ENABLED: ${APP_MINIAPP_AUTH_ENABLED:-false}
      APP_MINIAPP_WECHAT_APP_ID: ${APP_MINIAPP_WECHAT_APP_ID:-}
      APP_MINIAPP_WECHAT_APP_SECRET: ${APP_MINIAPP_WECHAT_APP_SECRET:-}
      APP_MINIAPP_PUBLIC_ORIGIN: ${APP_MINIAPP_PUBLIC_ORIGIN:-https://yangdoujiao.com}
      APP_MINIAPP_ACCESS_TOKEN_TTL: ${APP_MINIAPP_ACCESS_TOKEN_TTL:-15m}
      APP_MINIAPP_REFRESH_TOKEN_TTL: ${APP_MINIAPP_REFRESH_TOKEN_TTL:-30d}
      APP_MINIAPP_LOCAL_PROVIDER_ENABLED: "false"
      APP_MINIAPP_LOCAL_TEST_CODE: ""
      APP_MINIAPP_LOCAL_TEST_SUBJECT: ""
      APP_COMMUNITY_CURSOR_SECRET: ${APP_COMMUNITY_CURSOR_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      frontend-backend:
        ipv4_address: ${BACKEND_INTERNAL_IP}
      data:
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--header", "X-Forwarded-Proto: https", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-udajo/frontend:preview}
    build:
      context: ./frontend
    environment:
      NODE_ENV: production
      API_BASE_URL: http://backend:8080
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
      PUBLIC_INDEXING_ENABLED: ${PUBLIC_INDEXING_ENABLED:-false}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      frontend-backend:
        ipv4_address: ${FRONTEND_INTERNAL_IP}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  elasticsearch-data:
  caddy-data:
  caddy-config:

networks:
  frontend-backend:
    ipam:
      config:
        - subnet: ${DEPLOYMENT_NETWORK_SUBNET}
  data:
