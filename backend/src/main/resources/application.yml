spring:
  application:
    name: backend
  profiles:
    default: dev
  config:
    import: optional:file:../.env[.properties]

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false

server:
  error:
    include-message: never
    include-stacktrace: never

logging:
  level:
    root: INFO
    com.yangdoujiao.website: INFO

app:
  search:
    index:
      batch-size: 200
      initialize-on-startup: true
    sync:
      batch-size: 50
      poll-interval-ms: 5000
      max-attempts: 3
      retry-delay: 30s
      lock-timeout: 5m
      scheduling-enabled: true
