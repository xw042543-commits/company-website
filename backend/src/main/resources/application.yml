spring:
  application:
    name: backend
  profiles:
    default: dev
  config:
    import: optional:file:../.env[.properties]

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false

  session:
    timeout: ${APP_AUTH_SESSION_TIMEOUT:24h}
    jdbc:
      table-name: spring_session
      initialize-schema: never

server:
  servlet:
    session:
      cookie:
        name: JSESSIONID
        http-only: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never

logging:
  level:
    root: INFO
    com.yangdoujiao.website: INFO

app:
  trusted-proxies: ${APP_TRUSTED_PROXIES:}
  auth:
    registration-enabled: ${APP_AUTH_REGISTRATION_ENABLED:false}
    phone-registration-enabled: ${APP_AUTH_PHONE_REGISTRATION_ENABLED:true}
    agreement-version: ${APP_AUTH_AGREEMENT_VERSION:}
    privacy-version: ${APP_AUTH_PRIVACY_VERSION:}
    session-timeout: ${APP_AUTH_SESSION_TIMEOUT:24h}
    remembered-session-timeout: ${APP_AUTH_REMEMBERED_SESSION_TIMEOUT:30d}
    email-verification-ttl: ${APP_AUTH_EMAIL_VERIFICATION_TTL:30m}
    phone-verification-ttl: ${APP_AUTH_PHONE_VERIFICATION_TTL:10m}
    password-reset-ttl: ${APP_AUTH_PASSWORD_RESET_TTL:30m}
    maximum-body-size: ${APP_AUTH_MAXIMUM_BODY_SIZE:8KB}
    trusted-proxies: ${APP_AUTH_TRUSTED_PROXIES:}
    rate-limit:
      registration-per-ip: ${APP_AUTH_REGISTRATION_PER_IP:5}
      registration-per-identifier: ${APP_AUTH_REGISTRATION_PER_IDENTIFIER:3}
      resend-per-ip: ${APP_AUTH_RESEND_PER_IP:10}
      resend-per-identifier: ${APP_AUTH_RESEND_PER_IDENTIFIER:3}
      verification-per-ip: ${APP_AUTH_VERIFICATION_PER_IP:30}
      login-per-ip: ${APP_AUTH_LOGIN_PER_IP:20}
      login-per-identifier: ${APP_AUTH_LOGIN_PER_IDENTIFIER:10}
      wechat-start-per-ip: ${APP_AUTH_WECHAT_START_PER_IP:20}
      wechat-callback-per-ip: ${APP_AUTH_WECHAT_CALLBACK_PER_IP:30}
      window: ${APP_AUTH_RATE_LIMIT_WINDOW:1h}
    wechat:
      enabled: ${APP_AUTH_WECHAT_ENABLED:false}
      app-id: ${APP_AUTH_WECHAT_APP_ID:}
      app-secret: ${APP_AUTH_WECHAT_APP_SECRET:}
      callback-url: ${APP_AUTH_WECHAT_CALLBACK_URL:}
      state-ttl: ${APP_AUTH_WECHAT_STATE_TTL:5m}
      binding-ttl: ${APP_AUTH_WECHAT_BINDING_TTL:15m}
    resend:
      api-key: ${RESEND_API_KEY:}
      from: ${RESEND_FROM:}
      endpoint: ${RESEND_ENDPOINT:https://api.resend.com/emails}
      request-timeout: ${RESEND_REQUEST_TIMEOUT:10s}
  consultation:
    submission-enabled: ${APP_CONSULTATION_SUBMISSION_ENABLED:false}
    privacy-notice-version: ${APP_CONSULTATION_PRIVACY_NOTICE_VERSION:}
    maximum-body-size: ${APP_CONSULTATION_MAXIMUM_BODY_SIZE:16KB}
    trusted-proxies: ${APP_CONSULTATION_TRUSTED_PROXIES:}
    rate-limit:
      maximum-submissions: ${APP_CONSULTATION_RATE_LIMIT_MAXIMUM_SUBMISSIONS:5}
      window: ${APP_CONSULTATION_RATE_LIMIT_WINDOW:10m}
  search:
    index:
      batch-size: 200
      initialize-on-startup: true
    sync:
      batch-size: 50
      poll-interval-ms: 5000
      max-attempts: 3
      retry-delay: 30s
      lock-timeout: 5m
      scheduling-enabled: true
