spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  elasticsearch:
    uris: ${ELASTICSEARCH_URL}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

server:
  # 只允许应用自己的可信代理校验处理转发头，避免信任客户端伪造的 Forwarded 信息。
  forward-headers-strategy: none
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      cookie:
        secure: ${APP_SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  consultation:
    submission-enabled: ${APP_CONSULTATION_SUBMISSION_ENABLED:false}
  auth:
    registration-enabled: ${APP_AUTH_REGISTRATION_ENABLED:false}
    wechat:
      enabled: ${APP_AUTH_WECHAT_ENABLED:false}
      app-id: ${APP_AUTH_WECHAT_APP_ID:}
      app-secret: ${APP_AUTH_WECHAT_APP_SECRET:}
      callback-url: ${APP_AUTH_WECHAT_CALLBACK_URL:}
      state-ttl: ${APP_AUTH_WECHAT_STATE_TTL:5m}
      binding-ttl: ${APP_AUTH_WECHAT_BINDING_TTL:15m}
    production:
      notification-provider: ${APP_AUTH_PRODUCTION_NOTIFICATION_PROVIDER:NONE}
      approved-domain: ${APP_AUTH_APPROVED_DOMAIN:NONE}
      public-site-origin: ${APP_AUTH_PUBLIC_SITE_ORIGIN:}
      launch-approved: ${APP_AUTH_PRODUCTION_LAUNCH_APPROVED:false}
