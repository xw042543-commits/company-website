spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

server:
  servlet:
    session:
      cookie:
        secure: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  auth:
    registration-enabled: ${APP_AUTH_REGISTRATION_ENABLED:false}
    production:
      notification-provider: ${APP_AUTH_PRODUCTION_NOTIFICATION_PROVIDER:NONE}
      public-site-origin: ${APP_AUTH_PUBLIC_SITE_ORIGIN:}
      launch-approved: ${APP_AUTH_PRODUCTION_LAUNCH_APPROVED:false}
